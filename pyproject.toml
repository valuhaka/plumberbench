[project]
name = "plumberbench"
version = "0.1.0"
description = "A house with a hidden plumbing fault: look, test, diagnose and repair without flooding the kitchen."
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "mujoco>=3.2",
    "pillow>=10.1",
    "numpy",
    "fastmcp>=2.10",
    "starlette",
    "uvicorn",
]

[project.scripts]
plumberbench-web = "plumberbench.play:web_main"
plumberbench-play = "plumberbench.play:main"

[project.urls]
Homepage = "https://plumberbench.org"
Repository = "https://github.com/valuhaka/plumberbench"

[project.optional-dependencies]
dev = ["pytest", "mcp", "playwright", "openai-agents>=0.24"]
agents = ["openai-agents>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plumberbench = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
