schema_version = "1.1"

# Everything the judge needs lives in the simulator sidecar, out of the agent's reach.
# This must stay above the first [table]: below one, TOML files it under that table.
artifacts = [{ source = "/var/plumberbench", service = "mcp-server" }]

[task]
name = "plumberbench/l2-s001-facts"
description = "Diagnose and repair a household plumbing fault through a rendered 3D view (level 2, seed 1, facts mode)."
authors = []
keywords = ["plumberbench", "vision", "world-model", "diagnosis", "mcp"]

[metadata]
difficulty = "easy"
category = "agentic"
tags = ["mcp", "vision", "sidecar", "separate-verifier"]

[verifier]
timeout_sec = 180.0
environment_mode = "separate"

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0

[[environment.mcp_servers]]
name = "plumberbench"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []
