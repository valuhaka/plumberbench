schema_version = "1.1"

# Hour-one check of the harness, before any PlumberBench run:
#   - do MCP images reach the model at all?        (fails on every call otherwise)
#   - are later frames fresh, not the first again? (the stale-image bug)
#   - do sidecar artifacts and the separate verifier work?
# Run it three times with the agent and model you will be judged with.

artifacts = [
    { source = "/app/answer.txt" },
    { source = "/var/smoke", service = "mcp-server" },
]

[task]
name = "plumberbench/smoke-vision"
description = "Checks that MCP tool images reach the agent and stay fresh across calls."
authors = []
keywords = ["smoke-test", "vision", "mcp"]

[metadata]
difficulty = "easy"
category = "harness-check"
tags = ["mcp", "vision", "sidecar", "separate-verifier"]

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[agent]
timeout_sec = 300.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
gpus = 0

[[environment.mcp_servers]]
name = "smoke"
transport = "streamable-http"
url = "http://mcp-server:8000/mcp"
args = []
