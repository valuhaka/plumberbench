[project]
name = "plumberbench"
version = "0.1.0"
description = "A house with a hidden plumbing fault: look, test, diagnose and repair without flooding the kitchen."
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.2",
    "pillow>=10.1",
    "numpy",
    "fastmcp>=2.10",
    "starlette",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "mcp"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plumberbench = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
